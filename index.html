<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IronLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#faf9f6;--bg2:#fff;--bg3:#f0ede8;
  --card:#ffffff;--cb:#e8e3db;
  --t1:#1a1612;--t2:#7a7268;--t3:#b0a99e;
  --red:#E24B4A;--red-bg:#fef1f1;--red-text:#7a1f1f;
  --amber-bg:#f5f0e8;--amber-text:#8a6a30;
  --green-bg:#eaf3de;--green-text:#3B6D11;
  --rad:14px;--rad-sm:10px;--rad-xs:7px;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'Figtree',sans-serif;font-size:15px;line-height:1.5}
#root{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg)}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.visible{display:flex}
#s-loading{align-items:center;justify-content:center;gap:16px}
.logo-text{font-size:52px;font-weight:800;color:var(--t1);letter-spacing:-2px}
.logo-text span{color:var(--red)}
.spinner{width:28px;height:28px;border:2.5px solid var(--cb);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#s-auth{padding:40px 24px 32px;justify-content:flex-start}
.auth-logo{font-size:42px;font-weight:800;letter-spacing:-1.5px;color:var(--t1);margin-bottom:4px}
.auth-logo span{color:var(--red)}
.auth-tagline{font-size:14px;color:var(--t2);margin-bottom:40px}
.auth-tabs{display:flex;background:var(--card);border:1px solid var(--cb);border-radius:var(--rad-sm);padding:3px;margin-bottom:24px}
.auth-tab{flex:1;padding:10px;font-size:14px;font-weight:600;border:none;background:none;border-radius:8px;cursor:pointer;color:var(--t2);font-family:'Figtree',sans-serif;transition:all .15s}
.auth-tab.active{background:var(--t1);color:#fff}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;display:block}
.form-input{width:100%;background:var(--card);border:1px solid var(--cb);border-radius:var(--rad-sm);padding:13px 14px;font-size:15px;color:var(--t1);font-family:'Figtree',sans-serif;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--t1)}
.form-input::placeholder{color:var(--t3)}
.btn-auth{width:100%;background:var(--t1);color:#fff;border:none;border-radius:var(--rad-sm);padding:15px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Figtree',sans-serif;margin-top:6px;transition:opacity .15s}
.btn-auth:hover{opacity:.85}
.btn-auth:disabled{opacity:.4;cursor:not-allowed}
.auth-err{background:var(--red-bg);color:var(--red-text);border-radius:var(--rad-sm);padding:11px 14px;font-size:13px;margin-bottom:14px;display:none;font-weight:500}
.auth-err.show{display:block}
#s-app{flex-direction:column}
.app-body{flex:1;overflow-y:auto;padding-bottom:80px}
.bottom-nav{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--cb);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--t3);background:none;border:none;cursor:pointer;letter-spacing:.03em;text-transform:uppercase;font-family:'Figtree',sans-serif;transition:color .15s}
.nav-btn.active{color:var(--t1)}
.nav-icon{font-size:20px;line-height:1}
.page{display:none}
.page.active{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0}
.topbar-logo{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--t1)}
.topbar-logo span{color:var(--red)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--t1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;cursor:pointer}
.pi{padding:20px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--t2);background:var(--card);border:1px solid var(--cb);border-radius:99px;padding:7px 14px 7px 10px;cursor:pointer;margin-bottom:18px;font-family:'Figtree',sans-serif;transition:background .15s;line-height:1}
.back-btn:hover{background:var(--bg3)}
.hero{background:var(--t1);border-radius:var(--rad);padding:22px;margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-30px;right:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.04)}
.hero-eyebrow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:8px}
.hero-name{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1.1;margin-bottom:4px}
.hero-meta{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:18px}
.hero-cta{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 16px;border-radius:var(--rad-xs);font-size:13px;font-weight:700;cursor:pointer;font-family:'Figtree',sans-serif}
.week-strip{display:flex;gap:5px;margin-bottom:18px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.wd-lbl{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.04em}
.wd-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1px solid var(--cb);color:var(--t2);background:var(--card)}
.wd-dot.today{background:var(--t1);color:#fff;border-color:var(--t1)}
.wd-dot.done{background:var(--green-bg);color:var(--green-text);border-color:transparent}
.wd-dot.rest{color:var(--t3);background:transparent;border-color:transparent}
.sec-hdr{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin:18px 0 10px}
.session-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.session-tile{background:var(--card);border:1px solid var(--cb);border-radius:var(--rad);padding:16px;cursor:pointer;transition:border-color .15s,transform .1s}
.session-tile:active{transform:scale(.97)}
.session-tile.today-s{border-color:var(--t1);border-width:2px}
.s-badge{font-size:9px;font-weight:800;background:var(--t1);color:#fff;padding:3px 8px;border-radius:99px;letter-spacing:.06em;text-transform:uppercase;display:inline-block;margin-bottom:8px}
.s-name{font-size:17px;font-weight:800;color:var(--t1);letter-spacing:-.3px;margin-bottom:2px}
.s-meta{font-size:12px;color:var(--t2);margin-top:2px}
.s-last{font-size:11px;color:var(--t3);margin-top:4px}
.ex-preview{background:var(--card);border:1px solid var(--cb);border-radius:var(--rad);overflow:hidden;margin-bottom:10px}
.ex-ph{padding:12px 14px;border-bottom:1px solid var(--cb);display:flex;align-items:center;justify-content:space-between}
.ex-ph-day{font-size:13px;font-weight:700;color:var(--t1)}
.ex-ph-count{font-size:12px;color:var(--t2)}
.ex-pr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--cb);font-size:13px}
.ex-pr:last-child{border-bottom:none}
.ex-pr-name{color:var(--t1);font-weight:500}
.ex-pr-detail{color:var(--t3);font-size:12px;text-align:right}
.wbar{background:var(--t1);padding:18px 20px;display:flex;align-items:flex-start;justify-content:space-between}
.wbar-left{}
.wbar-title{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.4px}
.wbar-sub{font-size:12px;color:rgba(255,255,255,.45);margin-top:1px}
.wbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.wtimer{font-size:24px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.cancel-btn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.6);padding:7px 12px;border-radius:var(--rad-xs);font-size:12px;font-weight:700;cursor:pointer;font-family:'Figtree',sans-serif}
.ex-card{background:var(--card);border:1px solid var(--cb);border-radius:var(--rad);margin:0 20px 12px;overflow:hidden}
.ex-ch{padding:14px 14px 10px;border-bottom:1px solid var(--cb)}
.ex-ct{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.ex-cname{font-size:15px;font-weight:700;color:var(--t1);line-height:1.3}
.ex-tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0;background:var(--amber-bg);color:var(--amber-text)}
.ex-note{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.4}
.ex-last{font-size:11px;color:var(--t2);margin-top:4px;font-weight:500}
.sets-area{padding:12px 14px}
.sets-hdr{display:grid;grid-template-columns:26px 1fr 1fr 80px 30px;gap:6px;margin-bottom:8px}
.sh{font-size:10px;font-weight:700;color:var(--t3);text-align:center;text-transform:uppercase;letter-spacing:.03em}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 80px 30px;gap:6px;align-items:center;margin-bottom:7px}
.snum{font-size:12px;font-weight:700;color:var(--t3);text-align:center}
.sinput{background:var(--bg);border:1px solid var(--cb);border-radius:var(--rad-xs);padding:9px 4px;font-size:14px;font-weight:600;text-align:center;color:var(--t1);width:100%;font-family:'Figtree',sans-serif;outline:none;transition:border-color .15s}
.sinput:focus{border-color:var(--t1)}
.target-cell{background:var(--amber-bg);border-radius:var(--rad-xs);padding:6px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--amber-text);line-height:1.2}
.scheck{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--cb);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t3);justify-self:center;transition:all .15s;font-family:'Figtree',sans-serif}
.scheck.done{background:var(--t1);border-color:var(--t1);color:#fff}
.finish-wrap{padding:8px 20px 20px}
.btn-finish{width:100%;background:var(--t1);color:#fff;border:none;border-radius:var(--rad-sm);padding:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Figtree',sans-serif;transition:opacity .15s}
.btn-finish:hover{opacity:.85}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--cb);border-radius:var(--rad-sm);padding:14px}
.stat-lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat-val{font-size:26px;font-weight:800;color:var(--t1);letter-spacing:-.5px;line-height:1}
.stat-sub{font-size:11px;color:var(--t3);margin-top:3px}
.bar-wrap{background:var(--card);border:1px solid var(--cb);border-radius:var(--rad);padding:16px;margin-bottom:12px}
.bar-title{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:5px;height:72px}
.b-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.b-bar{width:100%;border-radius:3px 3px 0 0;background:var(--t1);opacity:.18;min-height:3px}
.b-bar.today{opacity:1;background:var(--red)}
.b-bar.has-data{opacity:.55}
.b-lbl{font-size:10px;font-weight:600;color:var(--t3)}
.pr-card{background:var(--card);border:1px solid var(--cb);border-radius:var(--rad);padding:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.pr-name{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:2px}
.pr-meta{font-size:12px;color:var(--t2)}
.pr-badge{background:var(--amber-bg);color:var(--amber-text);font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;white-space:nowrap}
.plan-card{background:var(--card);border:1px solid var(--cb);border-radius:var(--rad);padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.plan-card.active-plan{border-color:var(--t1);border-width:2px}
.plan-ct{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.plan-name{font-size:18px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.active-badge{background:var(--t1);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px}
.plan-freq{font-size:13px;color:var(--t2);margin-bottom:12px}
.plan-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.plan-pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--bg3);color:var(--t2)}
.plan-pill.rest{opacity:.4}
.plan-day-block{margin-top:10px;padding-top:10px;border-top:1px solid var(--cb)}
.pdn{font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;margin-top:8px}
.pdn:first-child{margin-top:0}
.pde{font-size:12px;color:var(--t2);line-height:1.7}
.prof-avatar{width:72px;height:72px;border-radius:50%;background:var(--t1);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;margin-bottom:12px}
.btn-outline{background:var(--card);border:1px solid var(--cb);border-radius:var(--rad-sm);padding:13px 16px;font-size:14px;font-weight:600;color:var(--t1);cursor:pointer;font-family:'Figtree',sans-serif;width:100%;text-align:left;margin-bottom:8px;transition:background .15s}
.btn-outline:hover{background:var(--bg3)}
.btn-danger{color:var(--red);border-color:rgba(226,75,74,.25)}
.log-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--cb)}
.log-row:last-child{border-bottom:none}
.log-icon{width:38px;height:38px;border-radius:var(--rad-xs);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.log-name{font-size:14px;font-weight:700;color:var(--t1)}
.log-meta{font-size:12px;color:var(--t2);margin-top:1px}
.log-vol{font-size:13px;font-weight:700;color:var(--t1);white-space:nowrap}
.period-toggle{display:flex;background:var(--card);border:1px solid var(--cb);border-radius:var(--rad-sm);padding:3px;margin-bottom:16px}
.period-btn{flex:1;padding:8px;font-size:12px;font-weight:700;border:none;background:none;border-radius:8px;cursor:pointer;color:var(--t2);font-family:'Figtree',sans-serif;text-transform:uppercase;letter-spacing:.04em;transition:all .15s}
.period-btn.active{background:var(--t1);color:#fff}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-ov.hidden{display:none}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:480px}
.modal-title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:16px;color:var(--t1)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--t1);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:500;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style>
</head>
<body>
<div id="root">

<div class="screen" id="s-loading">
  <div class="logo-text">Iron<span>Log</span></div>
  <div class="spinner"></div>
</div>

<div class="screen" id="s-auth">
  <div class="auth-logo">Iron<span>Log</span></div>
  <div class="auth-tagline">Track every rep. Own every PR.</div>
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Log in</button>
    <button class="auth-tab" onclick="switchTab('signup')">Sign up</button>
  </div>
  <div class="auth-err" id="aerr"></div>
  <div id="lf">
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="le" placeholder="you@example.com" autocomplete="email"></div>
    <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="lp" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-auth" onclick="doLogin()">Log in</button>
  </div>
  <div id="sf" style="display:none">
    <div class="form-group"><label class="form-label">Full name</label><input class="form-input" type="text" id="sn" placeholder="Alex Johnson" autocomplete="name"></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="se" placeholder="you@example.com" autocomplete="email"></div>
    <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="sp" placeholder="Min 6 characters" autocomplete="new-password"></div>
    <button class="btn-auth" onclick="doSignup()">Create account</button>
  </div>
</div>

<div class="screen" id="s-app">
  <div class="app-body">

    <div class="page active" id="page-home">
      <div class="topbar">
        <div class="topbar-logo">Iron<span>Log</span></div>
        <div class="avatar" id="user-av" onclick="showPage('profile')"></div>
      </div>
      <div class="pi">
        <div id="home-hero"></div>
        <div class="sec-hdr">This week</div>
        <div class="week-strip" id="week-strip"></div>
        <div class="sec-hdr">Recent workouts</div>
        <div id="recent-logs"></div>
      </div>
    </div>

    <div class="page" id="page-workout">
      <div id="workout-content"></div>
    </div>

    <div class="page" id="page-progress">
      <div class="pi">
        <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:16px">Progress</div>
        <div class="period-toggle">
          <button class="period-btn active" onclick="setPeriod('week',this)">Week</button>
          <button class="period-btn" onclick="setPeriod('month',this)">Month</button>
          <button class="period-btn" onclick="setPeriod('all',this)">All time</button>
        </div>
        <div id="progress-content"></div>
      </div>
    </div>

    <div class="page" id="page-plans">
      <div class="pi">
        <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px">Plans</div>
        <div style="font-size:13px;color:var(--t2);margin-bottom:20px">Tap to activate a plan</div>
        <div id="plans-list"></div>
      </div>
    </div>

    <div class="page" id="page-profile">
      <div class="pi">
        <button class="back-btn" onclick="showPage('home')">← Home</button>
        <div id="profile-content"></div>
      </div>
    </div>

  </div>
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="showPage('home')" id="nav-home"><div class="nav-icon">🏠</div>Home</button>
    <button class="nav-btn" onclick="showPage('workout')" id="nav-workout"><div class="nav-icon">🏋️</div>Workout</button>
    <button class="nav-btn" onclick="showPage('progress')" id="nav-progress"><div class="nav-icon">📈</div>Progress</button>
    <button class="nav-btn" onclick="showPage('plans')" id="nav-plans"><div class="nav-icon">📋</div>Plans</button>
  </nav>
</div>

<div class="modal-ov hidden" id="finish-modal">
  <div class="modal">
    <div class="modal-title">Save workout?</div>
    <div id="finish-summary"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-outline" style="flex:0 0 auto;padding:13px 18px;margin:0" onclick="closeFinish()">Cancel</button>
      <button class="btn-finish" onclick="confirmLog()">Save workout</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient('https://vtnhazqhqhpfocypsdhg.supabase.co','sb_publishable_X-yL-nZkHn_yt802I2tYrQ_AmPh8bQl');

const PLANS = [
  {
    id:'ud_custom', name:"Yudi's Upper/Lower", frequency:'4 days/week',
    schedule:['Upper Body A','Lower Body A','Rest','Upper Body B','Lower Body B','Rest','Rest'],
    days:{
      'Upper Body A':[
        {name:'Bench Press',sets:3,reps:'6-12',notes:'Compound primary'},
        {name:'Barbell Row',sets:3,reps:'6-12',notes:'Keep core braced, do not swing'},
        {name:'Seated Overhead DB Press',sets:3,reps:'8-12',notes:"Keep ribs tucked, don't overarch lower back"},
        {name:'Pec Dec Fly',sets:2,reps:'10-12',notes:'3-second negative (eccentric)'},

let user=null,profile={active_plan_id:'ud_custom',full_name:''},lastWeights={},logs=[],currentWorkout=null,workoutTimer=null,workoutSeconds=0,activeExData=[],period='week';

function getPlan(){return PLANS.find(p=>p.id===profile.active_plan_id)||PLANS[0]}
function getTodaySess(){const p=getPlan();const wd=(new Date().getDay()+6)%7;return p.schedule[wd%p.schedule.length]}
function fmtDate(d){return new Date(d).toLocaleDateString('en-AU',{weekday:'short',month:'short',day:'numeric'})}
function fmtTime(s){return Math.floor(s/60).toString().padStart(2,'0')+':'+(Math.round(s)%60).toString().padStart(2,'0')}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}

function switchTab(tab){
  document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='signup')));
  document.getElementById('lf').style.display=tab==='login'?'':'none';
  document.getElementById('sf').style.display=tab==='signup'?'':'none';
  setErr('');
}
function setErr(m){const e=document.getElementById('aerr');e.textContent=m;e.classList.toggle('show',!!m)}
async function doLogin(){
  const email=document.getElementById('le').value.trim(),pass=document.getElementById('lp').value;
  if(!email||!pass){setErr('Please fill in all fields.');return}
  const btn=event.target;btn.disabled=true;btn.textContent='Logging in…';
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;btn.textContent='Log in';
  if(error)setErr(error.message);
}
async function doSignup(){
  const name=document.getElementById('sn').value.trim(),email=document.getElementById('se').value.trim(),pass=document.getElementById('sp').value;
  if(!name||!email||!pass){setErr('Please fill in all fields.');return}
  if(pass.length<6){setErr('Password must be at least 6 characters.');return}
  const btn=event.target;btn.disabled=true;btn.textContent='Creating account…';
  const{error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
  btn.disabled=false;btn.textContent='Create account';
  if(error)setErr(error.message);
  else setErr('Check your email to confirm, then log in!');
}
async function doLogout(){await sb.auth.signOut()}

async function loadData(uid){
  const{data:p}=await sb.from('profiles').select('*').eq('id',uid).single();if(p)profile=p;
  const{data:lw}=await sb.from('last_weights').select('*').eq('user_id',uid);if(lw)lw.forEach(r=>lastWeights[r.exercise_name]={sets:r.sets});
  const{data:lg}=await sb.from('workout_logs').select('*').eq('user_id',uid).order('logged_at',{ascending:false}).limit(100);
  if(lg)logs=lg.map(r=>({id:r.id,date:r.logged_at,session:r.session_name,duration:r.duration_seconds,totalVolume:r.total_volume,exercises:r.exercises}));
}
async function saveProf(u){profile={...profile,...u};await sb.from('profiles').upsert({id:user.id,...profile})}
async function saveLW(name,sets){lastWeights[name]={sets};await sb.from('last_weights').upsert({user_id:user.id,exercise_name:name,sets,updated_at:new Date().toISOString()},{onConflict:'user_id,exercise_name'})}
async function saveLog(log){
  const{data}=await sb.from('workout_logs').insert({user_id:user.id,session_name:log.session,duration_seconds:log.duration,total_volume:log.totalVolume,exercises:log.exercises,logged_at:new Date().toISOString()}).select().single();
  if(data){log.id=data.id;log.date=data.logged_at}
  logs.unshift(log);
}

function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  const nb=document.getElementById('nav-'+name);if(nb)nb.classList.add('active');
  if(name==='home')renderHome();
  if(name==='workout')renderWorkout();
  if(name==='progress')renderProgress();
  if(name==='plans')renderPlans();
  if(name==='profile')renderProfile();
}

function renderHome(){
  document.getElementById('user-av').textContent=initials(profile.full_name);
  const plan=getPlan(),today=getTodaySess();
  const he=document.getElementById('home-hero');
  if(today==='Rest'){
    he.innerHTML=`<div class="hero" onclick="showPage('workout')"><div class="hero-eyebrow">Today</div><div class="hero-name">Rest Day</div><div class="hero-meta">Tap to pick a session anyway</div></div>`;
  } else {
    const exs=plan.days[today]||[];
    he.innerHTML=`<div class="hero" onclick="showPage('workout')"><div class="hero-eyebrow">Today's workout</div><div class="hero-name">${today}</div><div class="hero-meta">${exs.length} exercises · ${plan.name}</div><button class="hero-cta">▶ Start or pick session</button></div>`;
  }
  const dl=['M','T','W','T','F','S','S'],todayWD=(new Date().getDay()+6)%7;
  let ws='';
  for(let i=0;i<7;i++){
    const sess=plan.schedule[i%plan.schedule.length],isRest=sess==='Rest',isToday=i===todayWD;
    const hasLog=logs.some(l=>(new Date(l.date).getDay()+6)%7===i&&(Date.now()-new Date(l.date).getTime())<7*86400000);
    const cls=isToday?'today':hasLog?'done':isRest?'rest':'';
    ws+=`<div class="wd"><div class="wd-lbl">${dl[i]}</div><div class="wd-dot ${cls}">${isRest?'·':sess.substring(0,2)}</div></div>`;
  }
  document.getElementById('week-strip').innerHTML=ws;
  const recent=logs.slice(0,4);
  document.getElementById('recent-logs').innerHTML=recent.length
    ?`<div style="background:var(--card);border:1px solid var(--cb);border-radius:var(--rad);padding:4px 16px">${recent.map(l=>`<div class="log-row"><div class="log-icon">🏋️</div><div style="flex:1"><div class="log-name">${l.session}</div><div class="log-meta">${fmtDate(l.date)} · ${fmtTime(l.duration)}</div></div><div class="log-vol">${(Math.round(Number(l.totalVolume)/100)/10)}t</div></div>`).join('')}</div>`
    :`<div style="font-size:14px;color:var(--t2)">No workouts yet — let's go!</div>`;
}

function renderWorkout(){
  if(currentWorkout){renderActiveWorkout();return}
  const plan=getPlan(),today=getTodaySess(),names=Object.keys(plan.days),el=document.getElementById('workout-content');
  const tiles=names.map(name=>{
    const exs=plan.days[name],isToday=name===today,ll=logs.find(l=>l.session===name);
    return`<div class="session-tile ${isToday?'today-s':''}" onclick="startSess('${plan.id}','${name}')">
      ${isToday?`<div class="s-badge">Today</div><br>`:''}
      <div class="s-name">${name}</div>
      <div class="s-meta">${exs.length} exercises</div>
      <div class="s-last">Last: ${ll?fmtDate(ll.date):'Never'}</div>
    </div>`;
  }).join('');
  const previews=names.map(name=>{
    const exs=plan.days[name];
    return`<div class="ex-preview"><div class="ex-ph"><span class="ex-ph-day">${name}</span><span class="ex-ph-count">${exs.length} exercises</span></div>${exs.map(e=>`<div class="ex-pr"><span class="ex-pr-name">${e.name}</span><span class="ex-pr-detail">${e.sets}×${e.reps}${lastWeights[e.name]?' · '+lastWeights[e.name].sets[0].weight+'kg':''}</span></div>`).join('')}</div>`;
  }).join('');
  el.innerHTML=`<div class="pi"><div style="font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px">Choose session</div><div style="font-size:13px;color:var(--t2);margin-bottom:16px">${plan.name}</div><div class="session-grid">${tiles}</div>${previews}</div>`;
}

function startSess(planId,dayName){
  const plan=PLANS.find(p=>p.id===planId),exs=plan.days[dayName];
  activeExData=exs.map(e=>{
    const last=lastWeights[e.name];
    return{name:e.name,reps:e.reps,notes:e.notes,sets:Array.from({length:e.sets},(_,i)=>({
      weight:last?(last.sets[Math.min(i,last.sets.length-1)].weight||''):'',
      reps:last?(last.sets[Math.min(i,last.sets.length-1)].reps||e.reps.split('-')[0]):e.reps.split('-')[0],
      done:false
    }))};
  });
  currentWorkout={planId,dayName,startTime:Date.now()};
  workoutSeconds=0;clearInterval(workoutTimer);
  workoutTimer=setInterval(()=>{workoutSeconds++;const el=document.getElementById('timer-el');if(el)el.textContent=fmtTime(workoutSeconds)},1000);
  showPage('workout');
}

function getLastStr(name){const w=lastWeights[name];return w?w.sets.map(s=>s.weight+'kg×'+s.reps).join(', '):null}

function renderActiveWorkout(){
  const el=document.getElementById('workout-content');
  const exCards=activeExData.map((ex,ei)=>{
    const ls=getLastStr(ex.name);
    const rows=ex.sets.map((s,si)=>`<div class="set-row">
      <div class="snum">${si+1}</div>
      <input class="sinput" type="number" placeholder="0" value="${s.weight}" step="0.5" min="0" oninput="updS(${ei},${si},'weight',this.value)">
      <input class="sinput" type="number" placeholder="0" value="${s.reps}" step="1" min="0" oninput="updS(${ei},${si},'reps',this.value)">
      <div class="target-cell">${ex.reps}<br>target</div>
      <button class="scheck ${s.done?'done':''}" onclick="togS(${ei},${si})">✓</button>
    </div>`).join('');
    return`<div class="ex-card">
      <div class="ex-ch">
        <div class="ex-ct"><div class="ex-cname">${ex.name}</div><div class="ex-tag">${ex.sets} sets · ${ex.reps}</div></div>
        ${ex.notes?`<div class="ex-note">${ex.notes}</div>`:''}
        ${ls?`<div class="ex-last">Last: ${ls}</div>`:''}
      </div>
      <div class="sets-area">
        <div class="sets-hdr"><div class="sh">Set</div><div class="sh">kg</div><div class="sh">Reps</div><div class="sh">Target</div><div></div></div>
        ${rows}
      </div>
    </div>`;
  }).join('');
  el.innerHTML=`
    <div class="wbar">
      <div class="wbar-left">
        <div class="wbar-title">${currentWorkout.dayName}</div>
        <div class="wbar-sub">${activeExData.length} exercises</div>
      </div>
      <div class="wbar-right">
        <div class="wtimer" id="timer-el">${fmtTime(workoutSeconds)}</div>
        <button class="cancel-btn" onclick="cancelW()">← Cancel</button>
      </div>
    </div>
    <div style="padding-top:12px">${exCards}<div class="finish-wrap"><button class="btn-finish" onclick="openFinish()">✓ Finish workout</button></div></div>`;
}

function updS(ei,si,f,v){activeExData[ei].sets[si][f]=v}
function togS(ei,si){activeExData[ei].sets[si].done=!activeExData[ei].sets[si].done;renderActiveWorkout()}
function cancelW(){if(!confirm('Cancel workout? Progress will be lost.'))return;clearInterval(workoutTimer);currentWorkout=null;renderWorkout()}

function openFinish(){
  const done=activeExData.flatMap(e=>e.sets.filter(s=>s.done));
  const vol=done.reduce((s,x)=>s+(parseFloat(x.weight)||0)*(parseInt(x.reps)||0),0);
  document.getElementById('finish-summary').innerHTML=`<div class="stat-grid">
    <div class="stat-card"><div class="stat-lbl">Duration</div><div class="stat-val">${fmtTime(workoutSeconds)}</div></div>
    <div class="stat-card"><div class="stat-lbl">Volume</div><div class="stat-val">${Math.round(vol)}kg</div></div>
    <div class="stat-card"><div class="stat-lbl">Exercises</div><div class="stat-val">${activeExData.length}</div></div>
    <div class="stat-card"><div class="stat-lbl">Sets done</div><div class="stat-val">${done.length}</div></div>
  </div>`;
  document.getElementById('finish-modal').classList.remove('hidden');
}
function closeFinish(){document.getElementById('finish-modal').classList.add('hidden')}

async function confirmLog(){
  closeFinish();
  const done=activeExData.flatMap(e=>e.sets.filter(s=>s.done));
  const vol=done.reduce((s,x)=>s+(parseFloat(x.weight)||0)*(parseInt(x.reps)||0),0);
  for(const ex of activeExData){const ds=ex.sets.filter(s=>s.done);if(ds.length)await saveLW(ex.name,ds.map(s=>({weight:parseFloat(s.weight)||0,reps:parseInt(s.reps)||0})))}
  await saveLog({session:currentWorkout.dayName,duration:workoutSeconds,totalVolume:vol,exercises:activeExData.map(e=>({name:e.name,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length)});
  clearInterval(workoutTimer);currentWorkout=null;
  toast('Workout saved! 💪');showPage('home');
}

function setPeriod(p,btn){period=p;document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderProgress()}

function renderProgress(){
  const now=Date.now(),days={week:7,month:30,all:9999}[period];
  const filtered=logs.filter(l=>(now-new Date(l.date).getTime())<days*86400000);
  const totalVol=filtered.reduce((s,l)=>s+Number(l.totalVolume),0);
  const totalSets=filtered.reduce((s,l)=>s+l.exercises.reduce((ss,e)=>ss+e.sets.length,0),0);
  const avgDur=filtered.length?Math.round(filtered.reduce((s,l)=>s+l.duration,0)/filtered.length):0;
  const n=Math.min(days===9999?14:days,14);
  const barData=[];
  for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const dStr=d.toDateString();const vol=filtered.filter(l=>new Date(l.date).toDateString()===dStr).reduce((s,l)=>s+Number(l.totalVolume),0);barData.push({label:n<=7?['M','T','W','T','F','S','S'][(d.getDay()+6)%7]:d.getDate(),vol,isToday:i===0})}
  const maxVol=Math.max(...barData.map(b=>b.vol),1);
  const exNames=[...new Set(logs.flatMap(l=>l.exercises.map(e=>e.name)))];
  const prCards=exNames.slice(0,8).map(name=>{
    const allSets=filtered.flatMap(l=>l.exercises.filter(e=>e.name===name).flatMap(e=>e.sets));
    if(!allSets.length)return'';
    const maxW=Math.max(...allSets.map(s=>s.weight||0));
    const last=lastWeights[name],lastW=last?Math.max(...last.sets.map(s=>s.weight)):0;
    return`<div class="pr-card"><div><div class="pr-name">${name}</div><div class="pr-meta">Last: ${lastW?lastW+'kg':'–'} · ${allSets.length} sets</div></div><div class="pr-badge">🏆 ${maxW}kg</div></div>`;
  }).filter(Boolean).join('');
  document.getElementById('progress-content').innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-lbl">Workouts</div><div class="stat-val">${filtered.length}</div><div class="stat-sub">${period==='week'?'this week':period==='month'?'this month':'total'}</div></div>
      <div class="stat-card"><div class="stat-lbl">Volume</div><div class="stat-val">${(Math.round(totalVol/100)/10)}t</div><div class="stat-sub">tonnes</div></div>
      <div class="stat-card"><div class="stat-lbl">Sets</div><div class="stat-val">${totalSets}</div></div>
      <div class="stat-card"><div class="stat-lbl">Avg time</div><div class="stat-val" style="font-size:20px">${avgDur?fmtTime(avgDur):'–'}</div></div>
    </div>
    <div class="bar-wrap"><div class="bar-title">Volume per day</div><div class="bars">${barData.map(b=>{const h=Math.max(3,Math.round((b.vol/maxVol)*68));return`<div class="b-col"><div class="b-bar ${b.isToday?'today':b.vol>0?'has-data':''}" style="height:${h}px"></div><div class="b-lbl">${b.label}</div></div>`}).join('')}</div></div>
    ${prCards?`<div class="sec-hdr">Exercise records</div>${prCards}`:''}
    ${filtered.length?`<div class="sec-hdr">History</div><div style="background:var(--card);border:1px solid var(--cb);border-radius:var(--rad);padding:4px 16px">${filtered.map(l=>`<div class="log-row"><div class="log-icon">🏋️</div><div style="flex:1"><div class="log-name">${l.session}</div><div class="log-meta">${fmtDate(l.date)} · ${fmtTime(l.duration)}</div></div><div class="log-vol">${Math.round(Number(l.totalVolume))}kg</div></div>`).join('')}</div>`:''}`;
}

async function boot(session){
  if(!session){document.getElementById('s-loading').classList.remove('visible');document.getElementById('s-auth').classList.add('visible');return}
  user=session.user;await loadData(user.id);
  document.getElementById('s-loading').classList.remove('visible');
  document.getElementById('s-app').classList.add('visible');
  renderHome();
}

sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==='SIGNED_IN'){
    user=session.user;await loadData(user.id);
    ['s-auth','s-loading'].forEach(id=>document.getElementById(id).classList.remove('visible'));
    document.getElementById('s-app').classList.add('visible');
    showPage('home');
  }
  if(event==='SIGNED_OUT'){
    user=null;profile={active_plan_id:'ud_custom',full_name:''};lastWeights={};logs=[];currentWorkout=null;clearInterval(workoutTimer);
    document.getElementById('s-app').classList.remove('visible');
    document.getElementById('s-auth').classList.add('visible');
  }
});

(async()=>{const{data:{session}}=await sb.auth.getSession();boot(session)})();
</script>
</body>
</html>
